name: CI

# Runs the unit tests on feature branches and PRs. Pushes to main are tested by
# release.yml, which also publishes them. WPF needs a Windows runner.

on:
  push:
    branches-ignore: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test src-sharp/ClaudeMeter.slnx -c Release
