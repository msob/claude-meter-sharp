name: Release

# Every push to main builds ClaudeMeter.exe and publishes it as a new GitHub
# Release. Version = major.minor from <Version> in ClaudeMeter.csproj + the
# workflow run number as patch (e.g. 0.2.17). Bump major/minor in the csproj.
# Add "[skip ci]" to a commit message to push without releasing.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# Never run two releases at once; they'd race for the version/tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run unit tests
        run: dotnet test src-sharp/ClaudeMeter.slnx -c Release

      - name: Compute version
        id: version
        shell: bash
        run: |
          BASE=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\)\..*</Version>.*:\1:p' src-sharp/ClaudeMeter/ClaudeMeter.csproj)
          [[ "$BASE" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "Couldn't read <Version> from ClaudeMeter.csproj"; exit 1; }
          echo "version=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish single-file exe
        run: >
          dotnet publish src-sharp/ClaudeMeter -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -p:Version=${{ steps.version.outputs.version }} -o dist

      # gh ships with the runner — no Node-based release action to keep current.
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/ClaudeMeter.exe \
            --title "Claude Meter v$VERSION" --target "$GITHUB_SHA" --generate-notes
